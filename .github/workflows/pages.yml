name: Deploy to GitHub Pages

# Publishes the minified build (npm run build -> Statistics_Toolbox/dist) on every push to main.
# One-time setup by the repository owner: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# (Without that setting, Pages can still serve the unminified site from branch main, folder / (root): see the README.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: Statistics_Toolbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Statistics_Toolbox/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Statistics_Toolbox/dist
      - id: deployment
        uses: actions/deploy-pages@v4
