name: CI

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: Statistics_Toolbox

jobs:
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  e2e:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Statistics_Toolbox/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # Chromium runs everything (the slow edge-case sweep included); Firefox and WebKit run the quick suites,
      # which exercise every tool, the sample data, phone widths, lazy Chart.js loading and the page structure.
      - if: matrix.browser == 'chromium'
        run: npm run test:e2e
      - if: matrix.browser != 'chromium'
        run: npm run test:e2e:quick

  size:
    name: Script size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run size
